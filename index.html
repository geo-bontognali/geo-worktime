<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>worktime</title>
<style>
    /* ---------- tokens (catppuccin mocha) ---------- */
    :root {
        --crust: #11111b; --mantle: #181825; --base: #1e1e2e;
        --surface0: #313244; --surface1: #45475a; --surface2: #585b70;
        --overlay0: #6c7086; --overlay1: #7f849c; --subtext0: #a6adc8; --text: #cdd6f4;
        --lavender: #b4befe; --green: #a6e3a1; --yellow: #f9e2af; --red: #f38ba8;
        --font: 'CaskaydiaCove Nerd Font', 'CaskaydiaCove NF', 'JetBrainsMono Nerd Font', monospace;
        --lane: 104px;
    }
    @media (min-width: 2000px) { :root { --lane: 136px; } body { font-size: 14px; padding: 40px 64px; } }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        background: var(--base); color: var(--text);
        font: 13px/1.6 var(--font);
        padding: 28px 40px; overflow: hidden; user-select: none;
        display: flex; flex-direction: column;
    }
    #probe { position: absolute; visibility: hidden; white-space: pre; }
    .k { color: var(--overlay0); }
    .sug { font-style: italic; }

    /* ---------- header ---------- */
    header { display: flex; align-items: baseline; gap: 3ch; margin-bottom: 40px; white-space: pre; }
    #brand { color: var(--lavender); font-weight: bold; }
    .arrow { color: var(--overlay0); cursor: pointer; padding: 0 .5ch; }
    .arrow:hover { color: var(--text); }
    #dateT.today { color: var(--lavender); }
    #todayT { color: var(--overlay0); cursor: pointer; }
    #todayT:hover { color: var(--text); }
    #dayT { margin-left: auto; color: var(--subtext0); }
    #ai { color: var(--overlay0); cursor: pointer; }
    #ai.busy { color: var(--subtext0); }
    #ai.ok { color: var(--green); }
    #ai.err { color: var(--red); }

    /* ---------- timeline ---------- */
    #tl { position: relative; }
    #hours { position: relative; height: 22px; color: var(--overlay0); font-size: 12px; }
    #hours span { position: absolute; top: 0; transform: translateX(-50%); white-space: pre; }
    #hours .now { color: var(--red); }
    #lane { position: relative; height: var(--lane); background: var(--mantle); border-radius: 4px; overflow: hidden; }
    .run { position: absolute; top: 0; height: calc(50% - 1px); }
    .run.active { background: var(--green); }
    .run.idle { background: color-mix(in srgb, var(--yellow) 62%, var(--mantle)); }   /* on, but nobody at it */
    .off, .sw.off { background: repeating-linear-gradient(45deg, var(--surface1) 0 1px, transparent 1px 6px); }   /* the pc was off */
    #offs .off { position: absolute; top: 0; height: 100%; pointer-events: none; }
    .run.hl { box-shadow: inset 0 0 0 1px var(--text); }
    .mark { position: absolute; top: calc(50% + 1px); height: calc(50% - 1px); background: var(--c); pointer-events: none; transition: opacity .12s; }
    .mark.sug { background: color-mix(in srgb, var(--c) 55%, var(--mantle)); }
    .mark.dim { opacity: .25; }
    .sw { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 2px; }
    .sw.off { box-shadow: inset 0 0 0 1px var(--surface1); }
    #now { position: absolute; top: 0; height: 100%; width: 2px; background: var(--red); }
    .dim { position: absolute; top: 0; height: 100%; background: rgba(30, 30, 46, .6); opacity: 0; transition: opacity .12s; pointer-events: none; }
    .dim.on { opacity: 1; }
    #brk { position: relative; height: 24px; }
    #readout { height: 24px; line-height: 24px; white-space: pre; overflow: hidden; text-overflow: ellipsis; color: var(--subtext0); margin-top: 4px; }

    /* overlay over hours + lane + bracket row: the only pointer target of the timeline */
    #ov { position: absolute; top: 0; left: 0; right: 0; height: calc(22px + var(--lane) + 24px); }
    #ov > * { position: absolute; pointer-events: none; }
    #hl { top: 22px; height: var(--lane); width: 1px; background: var(--overlay1); display: none; }
    #region { top: 22px; height: var(--lane); background: rgba(205, 214, 244, .07); }
    .edge { top: 18px; height: calc(var(--lane) + 8px); width: 2px; margin-left: -1px; background: var(--text); border-radius: 1px; }
    .edge.snap { width: 3px; }
    .et { top: 0; height: 22px; padding: 0 4px; background: var(--base); font-weight: bold; font-size: 12px; white-space: pre; }
    #dur { top: calc(22px + var(--lane) + 4px); height: 20px; line-height: 20px; text-align: center; color: var(--subtext0); white-space: pre; overflow: hidden; }
    #ov:not(.on) #region, #ov:not(.on) .edge, #ov:not(.on) .et, #ov:not(.on) #dur { display: none; }

    /* ---------- customer prompt (replaces the readout line) ---------- */
    #prompt { display: flex; height: 24px; line-height: 24px; margin-top: 4px; white-space: pre; overflow: hidden; }
    #prompt[hidden] { display: none; }
    #prompt label { color: var(--subtext0); }
    #prompt input { font: inherit; color: var(--text); background: none; border: none; outline: none; width: 1ch; margin-right: 2ch; }
    #cands { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    #cands span.c { margin-right: 2ch; color: var(--overlay0); }
    #cands span.c b { font-weight: normal; color: var(--subtext0); }
    #cands .sel { background: var(--lavender); color: var(--base) !important; padding: 0 .5ch; border-radius: 2px; }
    #cands .sel b { color: var(--base) !important; }

    /* ---------- summary: the selection (or the day) per customer ---------- */
    #sum { margin-top: 36px; max-width: 170ch; flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--surface1) transparent; }
    #sumHead { display: flex; gap: 3ch; white-space: pre; margin-bottom: 14px; }
    #sumHead .sc { color: var(--lavender); font-weight: bold; }
    #copy { margin-left: auto; color: var(--overlay0); cursor: pointer; }
    #copy:hover { color: var(--text); }
    #copy.ok { color: var(--green); }
    .crow { display: grid; grid-template-columns: 5ch 26ch minmax(60px, 1fr) 7ch 6ch; align-items: center; gap: 2ch; height: 30px; padding: 0 1ch; border-radius: 3px; cursor: pointer; white-space: pre; }
    .crow:hover { background: var(--mantle); }
    .crow.on { background: var(--surface0); }
    .crow.on .bar { background: var(--surface1); }
    .crow .c { font-weight: bold; }
    .crow .n { color: var(--subtext0); overflow: hidden; text-overflow: ellipsis; }
    .crow .bar { position: relative; height: 6px; background: var(--surface0); border-radius: 3px; overflow: hidden; }
    .crow .bar i { position: absolute; top: 0; left: 0; height: 100%; background: var(--c); border-radius: 3px; }
    .crow .bar i.s { background: color-mix(in srgb, var(--c) 45%, transparent); }
    .crow .h, .crow .d { text-align: right; }
    .crow .d { color: var(--subtext0); }
    .crow.tot { cursor: default; border-top: 1px solid var(--surface0); border-radius: 0; margin-top: 6px; height: 34px; }
    .crow.tot:hover { background: none; }
    .crow.tot .d { color: var(--text); }
    .empty { color: var(--overlay0); padding: 8px 1ch; }

    footer { margin-top: 16px; color: var(--overlay0); white-space: pre; overflow: hidden; font-size: 12px; }
    footer kbd { font: inherit; color: var(--overlay1); }
</style>
</head>
<body>
<span id="probe">0000000000</span>
<header>
    <span id="brand">worktime</span>
    <span><span class="arrow" id="prev">‹</span><span id="dateT"></span><span class="arrow" id="next">›</span></span>
    <span id="todayT">today</span>
    <span id="dayT"></span>
    <span id="ai" hidden title="click to ask again"></span>
</header>
<div id="tl">
    <div id="hours"></div>
    <div id="lane"><div id="offs"></div><div id="runs"></div><div id="marks"></div><div id="now" hidden></div><div class="dim" id="dimL"></div><div class="dim" id="dimR"></div></div>
    <div id="brk"></div>
    <div id="ov">
        <div id="region"></div><div id="hl"></div>
        <div class="edge" id="e0"></div><div class="edge" id="e1"></div>
        <div class="et" id="t0"></div><div class="et" id="t1"></div>
        <div id="dur"></div>
    </div>
</div>
<div id="readout"></div>
<div id="prompt" hidden><label id="plabel"></label><input id="pin" spellcheck="false" autocomplete="off"><span id="cands"></span></div>
<div id="sum"><div id="sumHead"></div><div id="cust"></div></div>
<footer><kbd>drag</kbd> select   <kbd>click</kbd> block   <kbd>double-click</kbd> whole stretch   <kbd>esc</kbd> clear   <kbd>right-click</kbd> / <kbd>c</kbd> set customer   <kbd>y</kbd> copy   <kbd>← →</kbd> day   <kbd>t</kbd> today</footer>

<script src="config.js"></script>
<script>
// ---------- helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const MIN = 60000, HOUR = 3600000;
const rmin = ms => Math.round(ms / MIN) * MIN;   // shown times round to the minute, like durations
const hm = ms => { const d = new Date(rmin(ms)); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const dur = ms => { const m = Math.round(ms / MIN); return Math.floor(m / 60) + 'h' + pad2(m % 60); };
const span = s => dur(s.end - s.start);   // exact, so it is never below the active time inside it
const qh = ms => ms < MIN / 2 ? 0 : Math.max(.25, Math.round(ms / HOUR * 4) / 4);    // booking unit: quarter hours; seconds book nothing
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const floorH = t => { const d = new Date(t); d.setMinutes(0, 0, 0); return d.getTime(); };
const ceilH = t => { const f = floorH(t); return f === t ? t : f + HOUR; };
const store = {
    get(k, d) { try { const v = localStorage.getItem('wt.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { v == null ? localStorage.removeItem('wt.' + k) : localStorage.setItem('wt.' + k, JSON.stringify(v)); } catch { } },
};
const DOW = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const MON = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const dkey = d => `${d.y}-${pad2(d.m)}-${pad2(d.d)}`;
const dms = d => new Date(d.y, d.m - 1, d.d).getTime();
const todayD = () => { const n = new Date(); return { y: n.getFullYear(), m: n.getMonth() + 1, d: n.getDate() }; };
const isToday = d => dkey(d) === dkey(todayD());
const shiftDay = (d, n) => { const x = new Date(d.y, d.m - 1, d.d + n); return { y: x.getFullYear(), m: x.getMonth() + 1, d: x.getDate() }; };
const fmtDate = d => `${DOW[new Date(d.y, d.m - 1, d.d).getDay()]} ${d.d} ${MON[d.m - 1]} ${d.y}`;
const dayEnd = d => dms(shiftDay(d, 1));   // next local midnight (23 / 25 h after d0 on the dst days)
const hmE = ms => rmin(ms) >= dayEnd(state.date) ? '24:' + pad2(new Date(rmin(ms)).getMinutes()) : hm(ms);   // a log that runs to midnight ends at 24:00
const dict = o => Object.assign(Object.create(null), o);   // prototype-free map: a title 'constructor' must not hit Object.prototype

// ---------- config ----------
const CFG = window.WORKTIME_CONFIG || {};
const PALETTE = ['#89b4fa', '#cba6f7', '#fab387', '#94e2d5', '#f5c2e7', '#f9e2af', '#74c7ec', '#f2cdcd', '#eba0ac', '#89dceb'];
const CAT = { blue: '#89b4fa', mauve: '#cba6f7', peach: '#fab387', teal: '#94e2d5', pink: '#f5c2e7', yellow: '#f9e2af', sapphire: '#74c7ec',
    flamingo: '#f2cdcd', maroon: '#eba0ac', sky: '#89dceb', green: '#a6e3a1', red: '#f38ba8', lavender: '#b4befe', rosewater: '#f5e0dc' };
const pat = s => s.length > 2 && s[0] === '/' && s.at(-1) === '/' ? new RegExp(s.slice(1, -1), 'i') : s.toLowerCase();
const CUST = new Map();   // code -> { code, name, color, pats }
(CFG.customers || []).forEach((c, i) => CUST.set(c.code, { code: c.code, name: c.name || c.code, color: CAT[c.color] || c.color || PALETTE[i % PALETTE.length], pats: (c.match || []).map(pat) }));
const INT = { code: 'INT', name: (CFG.internal && CFG.internal.name) || 'internal', color: '#7f849c', pats: ((CFG.internal && CFG.internal.match) || []).map(pat) };
const INT_JIRA = new Set((CFG.internal && CFG.internal.jira) || []);
const IGNORE = (CFG.ignore || []).map(pat);
const RULES = dict(CFG.rules);
const AI = CFG.ai && CFG.ai.endpoint && CFG.ai.apiKey ? CFG.ai : null;
// customer by code; codes of old assignments or rules that are not configured are created on the fly
function cust(code) {
    if (code === 'INT') return INT;
    let c = CUST.get(code);
    if (!c) CUST.set(code, c = { code, name: code, color: PALETTE[CUST.size % PALETTE.length], pats: [] });
    return c;
}
const color = code => !code || code === '?' ? 'var(--surface2)' : cust(code).color;
const CLS = [[/teams/, 'teams'], [/outlook/, 'outlook'], [/chatgpt/, 'chatgpt'], [/claude/, 'claude'], [/music\.youtube/, 'music'],
    [/keeper/, 'keeper'], [/office|excel|powerpoint|sharepoint/, 'office'], [/chrom/, 'chrome'], [/^code|vscode|visual/, 'code'],
    [/kitty/, 'kitty'], [/rider/, 'rider'], [/remmina/, 'remmina'], [/anydesk/, 'anydesk']];
function clsShort(c) {
    if (c === 'N/A') return 'locked';
    const l = c.toLowerCase();
    for (const [re, n] of CLS) if (re.test(l)) return n;
    return c.length > 10 ? c.slice(0, 10) : c;
}

// ---------- state ----------
const state = {
    date: todayD(), live: null, samples: [], items: [], sessions: [], runs: [], blocks: [], snaps: [],
    range: { start: 0, end: 1 }, day: null, sel: null, filter: null, hov: null, px: null, prompt: null,
    laneW: 1, laneX: 0, chW: 8, assign: dict(store.get('assign')), ai: dict(store.get('ai')),
};
const scope = () => state.sel || state.day || state.range;

// ---------- parse ----------
const LINE = /^"(.*)","(.*)","(.*)","(.*)"$/, TS = /^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d):(\d\d)$/;
function parse(text, today) {
    const out = [], now = Date.now();
    for (const l of text.split(/\r?\n/)) {
        const m = LINE.exec(l), d = m && TS.exec(m[1]);
        if (!d) continue;   // header, blank or broken line
        const t = new Date(+d[1], d[2] - 1, +d[3], +d[4], +d[5], +d[6]).getTime();
        const locked = m[2] === 'N/A' && m[3] === 'N/A';
        out.push({ t, end: 0, title: m[2], cls: m[3], state: locked ? 'locked' : m[4] === 'true' ? 'idle' : 'active' });
    }
    out.sort((a, b) => a.t - b.t);
    // sample i covers [t, min(next, t+5min)); the last one 90 s, or up to now while the logger is alive today
    for (let i = 0; i < out.length; i++) {
        const s = out[i], n = out[i + 1];
        s.end = n ? Math.min(n.t, s.t + 5 * MIN) : today && now > s.t && now - s.t < 5 * MIN ? now : s.t + 90000;
    }
    return out;
}
const SUFFIX = / - Google Chrome$| - Visual Studio Code$| - Microsoft Azure$| \| Microsoft Teams$| - Outlook$| \(External\)$| \(External unfamiliar\)$/;
const GLYPH = /^[ -⯿\s]+/;   // spinner / status glyphs (✳ ◑ ◐ ●…) claude code puts in front of kitty titles
function clean(title) {   // display form: glyphs, unread counter "(2) " and app suffixes stripped, case kept
    let t = title.replace(GLYPH, '').replace(/^\(\d+\)\s+/, ''), u;
    while ((u = t.replace(SUFFIX, '')) !== t) t = u;
    return t.trim();
}
const titleKey = (title, cls) => clean(title).replace(/\s+/g, ' ').toLowerCase() + (cls === 'kitty' || cls === 'N/A' ? ' | ' + cls : '');

// samples -> sessions (+ off gaps in the same ordered list)
function build(samples) {
    const items = [], sessions = [];
    let cur = null;
    for (const s of samples) {
        const key = titleKey(s.title, s.cls);
        if (cur && cur.end === s.t && cur.key === key && cur.cls === s.cls && cur.state === s.state) { cur.end = s.end; cur.n++; continue; }
        if (cur && s.t > cur.end) items.push({ state: 'off', start: cur.end, end: s.t });
        cur = { start: s.t, end: s.end, key, title: s.title, cls: s.cls, state: s.state, n: 1, code: null, source: 'none', suggested: false, ignored: false, run: -1 };
        items.push(cur); sessions.push(cur);
    }
    state.items = items; state.sessions = sessions;
}

// ---------- resolve: which customer, per title ----------
const JIRA = /\b([A-Z][A-Z0-9]{1,5})-\d{1,6}\b/g;
const verdict = (v, source) => v === 'x' ? { code: null, source, ignored: true } : v === '-' ? { code: null, source } : { code: cust(v).code, source };
function classify(key, title, cls) {   // first hit wins: yours › config rules › jira key › keyword › ignore › ai
    let v = state.assign[key];
    if (v !== undefined) return verdict(v, 'manual');
    v = RULES[key];
    if (v !== undefined) return verdict(v, 'rule');
    JIRA.lastIndex = 0;
    for (let m; (m = JIRA.exec(title));) {
        if (INT_JIRA.has(m[1])) return { code: 'INT', source: 'jira' };
        if (CUST.has(m[1])) return { code: m[1], source: 'jira' };
    }
    const hay = (key + ' | ' + cls).toLowerCase();
    let best = null, len = 0;
    // longest entry as written wins (a /…/ counts its pattern, not the matched text), ties → config order
    const test = c => { for (const p of c.pats) {
        let l = 0;
        if (typeof p === 'string') { if (p && hay.includes(p)) l = p.length; }
        else if (p.test(hay)) l = p.source.length + 2;
        if (l > len) { len = l; best = c; }
    } };
    for (const c of CUST.values()) test(c);
    test(INT);
    if (best) return { code: best.code, source: 'keyword' };
    for (const p of IGNORE) if (typeof p === 'string' ? hay.includes(p) : p.test(hay)) return { code: null, source: 'ignore', ignored: true };
    const a = state.ai[key];
    if (a) { const c = a.c && (a.c === 'INT' || CUST.has(a.c)) ? a.c : null; return { code: c, source: 'ai', suggested: !!c }; }
    return { code: null, source: 'none' };
}
function resolve() {
    const memo = new Map(), S = state.sessions;
    for (const s of S) {
        if (s.state !== 'active') { s.code = null; s.source = 'none'; s.suggested = s.ignored = false; continue; }
        let r = memo.get(s.key);
        if (!r) memo.set(s.key, r = classify(s.key, s.title, s.cls));
        s.code = r.code; s.source = r.source; s.suggested = !!r.suggested; s.ignored = !!r.ignored;
    }
    // sandwich: short unassigned session between two active neighbours of the same customer takes it (as a suggestion)
    const act = S.filter(s => s.state === 'active'), base = act.map(s => s.code);
    for (let i = 1; i < act.length - 1; i++) {
        const s = act[i], p = act[i - 1], n = act[i + 1];
        if (base[i] || s.ignored || s.source === 'manual' || s.source === 'rule' || s.end - s.start > 10 * MIN) continue;
        if (base[i - 1] && base[i - 1] === base[i + 1] && s.start - p.end <= 20 * MIN && n.start - s.end <= 20 * MIN) { s.code = base[i - 1]; s.source = 'sandwich'; s.suggested = true; }
    }
    // runs: the lane blocks, worked or inactive (idle + locked); blocks: powered-on stretches
    const runs = [], blocks = [];
    let r = null, b = null;
    for (const it of state.items) {
        if (it.state === 'off') { r = null; b = null; continue; }
        const st = it.state === 'active' ? 'active' : 'idle';
        if (r && r.state === st) { r.end = it.end; it.run = r.i; }
        else { r = { i: runs.length, start: it.start, end: it.end, state: st }; runs.push(r); it.run = r.i; }
        if (b) b.end = it.end; else blocks.push(b = { start: it.start, end: it.end });
    }
    state.runs = runs; state.blocks = blocks;
}

// ---------- stats: the one source of every number ----------
function stats(sc, titles) {
    const r = { active: 0, idle: 0, byCode: {} };
    for (const it of state.items) {
        if (it.start >= sc.end) break;
        const a = Math.max(it.start, sc.start), b = Math.min(it.end, sc.end);
        if (b <= a) continue;
        const d = b - a;
        if (it.state === 'active') {
            r.active += d;
            const c = it.code || '?', e = r.byCode[c] || (r.byCode[c] = { active: 0, suggested: 0, ignored: 0, titles: titles ? new Map() : null });
            e.active += d;
            if (it.suggested) e.suggested += d;
            if (it.ignored) e.ignored += d;
            else if (titles) { const t = clean(it.title); e.titles.set(t, (e.titles.get(t) || 0) + d); }
        } else if (it.state !== 'off') r.idle += d;
    }
    return r;
}
const bookable = (c, e) => c === '?' ? e.active - e.ignored : e.active;   // ignored titles are never booked
function codesOf(st) {   // customers by time, then INT, then unassigned; a few seconds cut off by an edge are no row
    const rank = c => c === '?' ? 2 : c === 'INT' ? 1 : 0;
    return Object.keys(st.byCode).filter(c => st.byCode[c].active >= MIN / 2).sort((a, b) => rank(a) - rank(b) || st.byCode[b].active - st.byCode[a].active);
}

// ---------- timeline ----------
const lane = $('lane'), runsEl = $('runs'), ov = $('ov'), hoursEl = $('hours'), hl = $('hl'), readoutEl = $('readout');
const ms2x = ms => (ms - state.range.start) / (state.range.end - state.range.start) * state.laneW;
const x2ms = x => state.range.start + x / state.laneW * (state.range.end - state.range.start);
const pct = ms => (ms - state.range.start) / (state.range.end - state.range.start) * 100;
function measure() {
    state.chW = $('probe').getBoundingClientRect().width / 10;
    const r = lane.getBoundingClientRect();

$('next').addEventListener('click', () => goDay(1));
$('todayT').addEventListener('click', () => goDay(0));

// ---------- ai: suggests a customer for titles no rule knows ----------
const aiEl = $('ai');
let aiTimer = 0, aiBusy = false, aiOkT = 0, aiCtl = null;
function chip(st, v) {
    if (!AI) { aiEl.hidden = true; return; }
    aiEl.hidden = false; aiEl.className = st; aiEl.title = 'click to ask again';
    clearTimeout(aiOkT);
    if (st === 'busy') aiEl.textContent = 'ai …';
    else if (st === 'ok') { aiEl.textContent = `ai ✓ ${v}`; aiOkT = setTimeout(() => chip('idle'), 3000); }
    else if (st === 'err') { aiEl.textContent = 'ai ✗'; aiEl.title = v; }
    else aiEl.textContent = 'ai';
}
function aiSchedule() { if (!AI || aiBusy) return; clearTimeout(aiTimer); aiTimer = setTimeout(aiRun, 800); }
function aiPending() {   // distinct active titles no rule classified, ≥ 2 samples, not yet asked
    const n = new Map();
    for (const s of state.sessions) {
        if (s.state !== 'active' || (s.source !== 'none' && s.source !== 'sandwich') || s.key in state.ai) continue;
        const e = n.get(s.key) || n.set(s.key, { cls: s.cls, n: 0 }).get(s.key);
        e.n += s.n;
    }
    return [...n].filter(([, v]) => v.n >= 2).slice(0, 120);
}
const validCode = c => !c ? null : c === 'INT' || CUST.has(c) ? c : INT_JIRA.has(c) ? 'INT' : null;
async function aiRun() {
    if (!AI || aiBusy) return;
    const keys = aiPending();
    if (!keys.length) return;
    aiBusy = true; chip('busy');
    const hints = c => c.pats.length ? ` (hints: ${c.pats.map(p => typeof p === 'string' ? p : p.source).join(', ')})` : '';
    const codes = [...CUST.values()].map(c => `${c.code} ${c.name}${hints(c)}`).join('; ');
    const instructions = `You classify window titles from one consultant's workday into customers. Reply only with JSON {"r":[{"i":<index>,"c":"<code>"|null}]}. ` +
        `Codes: ${codes}; INT = internal ${INT.name} work${hints(INT)}. Context: ${CFG.context || ''} ` +
        `A kitty title is a Claude Code session name describing the task; map it to the customer it fits. Use null when there is no real evidence; never guess.`;
    // Azure insists the word "json" appears in the input (not only in instructions) when text.format is json_object
    const input = 'Classify these titles; answer as JSON.\n' + keys.map(([k, v], i) => `${i} | ${clsShort(v.cls)} | ${k}`).join('\n');
    const ctl = aiCtl = new AbortController(), to = setTimeout(() => ctl.abort(), 10000);
    let next = null;   // runs once the flag is down: the next batch (via reresolve) or the re-ask
    try {
        const res = await fetch(AI.endpoint.replace(/\/+$/, '') + '/responses', {
            method: 'POST', signal: ctl.signal,
            headers: { 'Content-Type': 'application/json', 'api-key': AI.apiKey },
            body: JSON.stringify({ model: AI.model || 'gpt-5.4', instructions, input, reasoning: { effort: AI.reasoningEffort || 'none' },
                text: { format: { type: 'json_object' } }, store: false, stream: false }),
        });
        if (!res.ok) {
            let msg = res.status + ' ' + res.statusText;
            try { msg = (await res.json()).error.message || msg; } catch { }
            throw new Error(msg);
        }
        const j = await res.json();
        let text = j.output_text || (j.output || []).flatMap(o => o.content || []).map(c => c.text || '').join('');
        text = text.replace(/^\s*```(?:json)?\s*/, '').replace(/\s*```\s*$/, '');
        const ans = new Map();
        for (const x of JSON.parse(text).r || []) if (Number.isInteger(x.i) && keys[x.i]) ans.set(keys[x.i][0], validCode(x.c));
        let fresh = 0;
        for (const [k] of keys) { const c = ans.get(k) || null; state.ai[k] = { c, at: Date.now() }; if (c) fresh++; }
        store.set('ai', state.ai);
        chip('ok', fresh);
        next = reresolve;
    } catch (e) {
        if (e === 'reask') next = aiSchedule;   // asked again while in flight: these answers are stale
        else chip('err', e.name === 'AbortError' ? 'timeout' : e.message || 'failed');
    } finally {
        clearTimeout(to);
        aiBusy = false; aiCtl = null;
    }
    if (next) next();
}
function aiReask() {   // forget today's answers and ask again
    if (!AI) return;
    if (aiCtl) aiCtl.abort('reask');
    for (const s of state.sessions) delete state.ai[s.key];
    store.set('ai', state.ai);
    reresolve();
    clearTimeout(aiTimer);
    aiRun();
}
aiEl.addEventListener('click', aiReask);

// ---------- boot ----------
function readHash() {   // #YYYY-MM-DD or #YYYY-MM-DD/HH:MM-HH:MM
    const m = /^#(\d{4})-(\d\d)-(\d\d)(?:\/(\d\d):(\d\d)-(\d\d):(\d\d))?$/.exec(location.hash);
    if (!m) return null;
    const date = shiftDay({ y: +m[1], m: +m[2], d: +m[3] }, 0);
    if (dkey(date) !== `${m[1]}-${m[2]}-${m[3]}`) return null;   // impossible date
    const at = (h, mi) => new Date(date.y, date.m - 1, date.d, +h, +mi).getTime();
    return { date, sel: m[4] ? { start: at(m[4], m[5]), end: at(m[6], m[7]) } : null };
}
function setHash() {
    const h = '#' + dkey(state.date) + (state.sel ? `/${hm(state.sel.start)}-${hmE(state.sel.end)}` : '');
    if (location.hash !== h) try { history.replaceState(null, '', h); } catch { }
}
function goDay(n) {
    state.date = n ? shiftDay(state.date, n) : todayD();
    state.sel = loadSel(); state.filter = null;
    setHash();
    load(false);
}
async function load(keep) {
    const key = dkey(state.date);
    let text = '';
    try { const r = await fetch(`logs/activity_log_${key}.csv`, { cache: 'no-store' }); if (r.ok) text = await r.text(); } catch { }
    if (key !== dkey(state.date) || (keep && (drag || state.prompt))) return;   // navigated meanwhile / busy
    state.live = isToday(state.date) ? key : null;
    state.samples = parse(text, isToday(state.date));
    build(state.samples); resolve(); layout();
    if (!state.day) state.sel = null;
    else if (state.sel) { state.sel = { start: clamp(state.sel.start, state.range.start, state.range.end), end: clamp(state.sel.end, state.range.start, state.range.end) }; if (state.sel.end - state.sel.start < MIN) state.sel = null; }
    store.set('sel.' + dkey(state.date), state.sel); setHash();
    renderHeader(); renderHours(); renderLane(); renderSel(-1); renderSummary();
    if (!state.prompt) hover(state.px);   // c must target the day on screen
    aiSchedule();
}
measure();
new ResizeObserver(() => { measure(); renderHours(); renderSel(-1); }).observe(lane);
chip('idle');
function selFrom(h) {   // the hash has whole minutes: keep the exact stored selection when it reads the same
    const s = loadSel();
    return h && h.sel && !(s && hm(s.start) === hm(h.sel.start) && hmE(s.end) === hmE(h.sel.end)) ? h.sel : s;
}
{
    const h = readHash();
    if (h) state.date = h.date;
    state.sel = selFrom(h);
    setHash();
    load(false);
}
window.addEventListener('hashchange', () => {
    const h = readHash();
    if (!h) { setHash(); return; }
    state.date = h.date; state.sel = selFrom(h); state.filter = null; load(false);
});
function tick() {   // today refetches; a live page left open follows the clock past midnight
    if (isToday(state.date)) load(true);
    else if (state.live === dkey(state.date) && !drag && !state.prompt) goDay(0);
}
setInterval(tick, 60000);
window.addEventListener('focus', tick);
</script>
