<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>worktime</title>
<style>
    /* ---------- tokens (catppuccin mocha) ---------- */
    :root {
        --crust: #11111b; --mantle: #181825; --base: #1e1e2e;
        --surface0: #313244; --surface1: #45475a; --surface2: #585b70;
        --overlay0: #6c7086; --overlay1: #7f849c; --subtext0: #a6adc8; --text: #cdd6f4;
        --lavender: #b4befe; --green: #a6e3a1; --yellow: #f9e2af; --red: #f38ba8;
        --font: 'CaskaydiaCove Nerd Font', 'CaskaydiaCove NF', 'JetBrainsMono Nerd Font', monospace;
        --lane: 208px; --hh: 24px;
    }
    @media (min-width: 2000px) { :root { --lane: 272px; } body { font-size: 16px; padding: 40px 64px; } }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        background: var(--base); color: var(--text);
        font: 15px/1.6 var(--font);
        padding: 28px 40px; overflow: hidden; user-select: none;
        display: flex; flex-direction: column;
    }
    #probe { position: absolute; visibility: hidden; white-space: pre; }
    .k { color: var(--overlay0); }

    /* ---------- header ---------- */
    header { display: flex; align-items: baseline; gap: 3ch; margin-bottom: 40px; white-space: pre; }
    #brand { color: var(--lavender); font-weight: bold; }
    .arrow { color: var(--overlay0); cursor: pointer; padding: 0 .5ch; }
    .arrow:hover { color: var(--text); }
    #dateT.today { color: var(--lavender); }
    #todayT { color: var(--overlay0); cursor: pointer; }
    #todayT:hover { color: var(--text); }
    #msg { margin-left: auto; color: var(--red); }

    /* ---------- timeline ---------- */
    #tl { position: relative; }
    #hours { position: relative; height: var(--hh); color: var(--overlay0); font-size: 14px; }
    #hours span { position: absolute; top: 0; transform: translateX(-50%); white-space: pre; }
    #hours .now { color: var(--red); }
    #lane { position: relative; height: var(--lane); background: var(--mantle); border-radius: 4px; overflow: hidden; }
    .run { position: absolute; top: 0; height: calc(50% - 1px); }
    .run.active { background: var(--green); }
    .run.idle { background: color-mix(in srgb, var(--yellow) 62%, var(--mantle)); }   /* on, but nobody at it */
    .off { background: repeating-linear-gradient(45deg, var(--surface1) 0 1px, transparent 1px 6px); }   /* the pc was off */
    #offs .off { position: absolute; top: 0; height: 100%; pointer-events: none; }
    .run.hl { box-shadow: inset 0 0 0 1px var(--text); }
    .mark { position: absolute; top: calc(50% + 1px); height: calc(50% - 1px); background: var(--c); pointer-events: none; transition: opacity .12s; }
    .mark.dim { opacity: .25; }
    #now { position: absolute; top: 0; height: 100%; width: 2px; background: var(--red); }
    .dim { position: absolute; top: 0; height: 100%; background: rgba(30, 30, 46, .6); opacity: 0; transition: opacity .12s; pointer-events: none; }
    .dim.on { opacity: 1; }
    #brk { position: relative; height: 30px; }
    #readout { position: relative; height: 24px; line-height: 24px; margin-top: 4px; }
    #ro { position: absolute; top: 0; max-width: 100%; white-space: pre; overflow: hidden; text-overflow: ellipsis; color: var(--subtext0); }   /* follows the pointer */

    /* overlay over hours + lane + bracket row: the only pointer target of the timeline */
    #ov { position: absolute; top: 0; left: 0; right: 0; cursor: crosshair; height: calc(var(--hh) + var(--lane) + 30px); }
    #ov > * { position: absolute; pointer-events: none; }
    #hl { top: var(--hh); height: var(--lane); width: 1px; background: var(--overlay1); display: none; }
    #region { top: var(--hh); height: var(--lane); background: rgba(205, 214, 244, .07); }
    .edge { top: calc(var(--hh) - 4px); height: calc(var(--lane) + 8px); width: 2px; margin-left: -1px; background: var(--text); border-radius: 1px; }
    .edge.snap { width: 3px; }
    .et { top: 0; height: var(--hh); padding: 0 4px; background: var(--base); font-weight: bold; font-size: 14px; white-space: pre; }
    #dur { top: calc(var(--hh) + var(--lane) + 3px); height: 26px; line-height: 26px; text-align: center; color: var(--text); font-size: 18px; font-weight: bold; white-space: pre; overflow: hidden; }
    #ov:not(.on) #region, #ov:not(.on) .edge, #ov:not(.on) .et, #ov:not(.on) #dur { display: none; }

    /* ---------- figures: selection and day, the numbers that matter ---------- */
    #figs { display: flex; justify-content: center; margin-top: 28px; white-space: pre; }
    #figs[hidden] { display: none; }
    .fg { padding-right: 6ch; }
    .fg + .fg { padding-left: 6ch; border-left: 1px solid var(--surface0); }
    .fl { color: var(--overlay0); margin-bottom: 6px; }
    .fl b { color: var(--subtext0); }
    .fg.sel .fl b { color: var(--lavender); }
    .row { display: flex; gap: 4ch; }
    .fig .v { font-size: 36px; line-height: 1.15; font-weight: bold; min-width: 3em; }
    .fig .v .u { font-weight: normal; color: var(--overlay0); }
    .fig .l { color: var(--overlay0); font-size: 13px; }
    .fig.act .v { color: var(--green); }
    .fig.idl .v { color: var(--yellow); }
    .fg.none .v { color: var(--surface1); }

    /* ---------- summary: the selection (or the day) per customer ---------- */
    #sum { margin-top: 32px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #sumHead { display: flex; gap: 3ch; white-space: pre; margin-bottom: 12px; }
    #sumHead .sc { color: var(--lavender); font-weight: bold; }
    #sumHead b { font-weight: bold; color: var(--text); }
    #sumHead .tot { margin-left: auto; }
    #copy { color: var(--overlay0); cursor: pointer; }
    #copy:hover { color: var(--text); }
    #copy.ok { color: var(--green); }
    /* mosaic: one tile per customer, area = active time */
    #cust { position: relative; flex: 1; min-height: 140px; }
    .tile { position: absolute; overflow: hidden; border-radius: 4px; background: var(--c); color: var(--crust); padding: 6px 8px; cursor: pointer; white-space: pre; line-height: 1.35; transition: opacity .12s; }
    .tile.q { background: var(--surface1); color: var(--text); }   /* ? */
    .tile:hover { filter: brightness(1.08); }
    .tile.dim { opacity: .25; }
    .tile.on { box-shadow: inset 0 0 0 2px var(--text); }
    .tile .c { font-weight: bold; }
    .tile .n { opacity: .75; overflow: hidden; text-overflow: ellipsis; }
    .tile .h { font-size: 24px; font-weight: bold; line-height: 1.2; }
    .tile .d { opacity: .75; }
    #tip { position: fixed; z-index: 5; pointer-events: none; padding: 4px 1ch; background: var(--crust); color: var(--text); border-radius: 3px; white-space: pre; font-size: 13px; }
    #tip[hidden] { display: none; }
    /* assign popover (right-click) */
    #asg { position: fixed; z-index: 6; width: 40ch; background: var(--mantle); border: 1px solid var(--surface1); border-radius: 6px; padding: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); }
    #asg[hidden] { display: none; }
    #asg .ah { color: var(--overlay0); margin-bottom: 8px; white-space: pre; }
    #asg .ah b { color: var(--text); }
    #asgIn { width: 100%; font: inherit; color: var(--text); background: var(--base); border: 1px solid var(--surface1); border-radius: 4px; padding: 4px 1ch; outline: none; }
    #asgIn:focus { border-color: var(--lavender); }
    #asgList { margin-top: 8px; max-height: 16.5em; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--surface1) transparent; }
    #asgList div { display: flex; gap: 2ch; padding: 1px 1ch; border-radius: 3px; cursor: pointer; white-space: pre; }
    #asgList div b { min-width: 3ch; }
    #asgList div span { color: var(--subtext0); overflow: hidden; text-overflow: ellipsis; }
    #asgList div.on { background: var(--surface0); }
    #asg .hint { margin-top: 8px; color: var(--overlay0); font-size: 13px; white-space: pre; }
    .empty { color: var(--overlay0); padding: 8px 1ch; }

    footer { margin-top: 16px; color: var(--overlay0); white-space: pre; overflow: hidden; font-size: 13px; }
    footer kbd { font: inherit; color: var(--overlay1); }
</style>
</head>
<body>
<span id="probe">0000000000</span>
<header>
    <span id="brand">worktime</span>
    <span><span class="arrow" id="prev">‹</span><span id="dateT"></span><span class="arrow" id="next">›</span></span>
    <span id="todayT">today</span>
    <span id="msg"></span>
</header>
<div id="tl">
    <div id="hours"></div>
    <div id="lane"><div id="offs"></div><div id="runs"></div><div id="marks"></div><div id="now" hidden></div><div class="dim" id="dimL"></div><div class="dim" id="dimR"></div></div>
    <div id="brk"></div>
    <div id="ov">
        <div id="region"></div><div id="hl"></div>
        <div class="edge" id="e0"></div><div class="edge" id="e1"></div>
        <div class="et" id="t0"></div><div class="et" id="t1"></div>
        <div id="dur"></div>
    </div>
</div>
<div id="readout"><span id="ro"></span></div>
<div id="figs" hidden></div>
<div id="sum"><div id="sumHead"></div><div id="cust"></div></div>
<div id="tip" hidden></div>
<div id="asg" hidden><div class="ah"></div><input id="asgIn" spellcheck="false" autocomplete="off" placeholder="code, or a new one: ABC name"><div id="asgList"></div><div class="hint">↑↓ choose   enter assign   esc cancel</div></div>
<footer><kbd>drag</kbd> new selection   <kbd>click</kbd> block   <kbd>double-click</kbd> / <kbd>esc</kbd> clear   <kbd>right-click</kbd> assign   <kbd>y</kbd> copy   <kbd>← →</kbd> day   <kbd>t</kbd> today</footer>

<script src="config.js"></script>
<script>
// ---------- helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const MIN = 60000, HOUR = 3600000;
const rmin = ms => Math.round(ms / MIN) * MIN;   // shown times round to the minute, like durations
const hm = ms => { const d = new Date(rmin(ms)); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const dur = ms => { const m = Math.round(ms / MIN); return Math.floor(m / 60) + ':' + pad2(m % 60); };   // 1:15
const span = s => dur(s.end - s.start);   // exact, so it is never below the active time inside it
const qh = ms => ms < MIN / 2 ? 0 : Math.max(.25, Math.round(ms / HOUR * 4) / 4);    // booking unit: quarter hours; seconds book nothing
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const floorH = t => { const d = new Date(t); d.setMinutes(0, 0, 0); return d.getTime(); };
const ceilH = t => { const f = floorH(t); return f === t ? t : f + HOUR; };
const store = {
    get(k, d) { try { const v = localStorage.getItem('wt.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { v == null ? localStorage.removeItem('wt.' + k) : localStorage.setItem('wt.' + k, JSON.stringify(v)); } catch { } },
};
const DOW = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const MON = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const dkey = d => `${d.y}-${pad2(d.m)}-${pad2(d.d)}`;
const dms = d => new Date(d.y, d.m - 1, d.d).getTime();
const todayD = () => { const n = new Date(); return { y: n.getFullYear(), m: n.getMonth() + 1, d: n.getDate() }; };
const isToday = d => dkey(d) === dkey(todayD());
const shiftDay = (d, n) => { const x = new Date(d.y, d.m - 1, d.d + n); return { y: x.getFullYear(), m: x.getMonth() + 1, d: x.getDate() }; };
const fmtDate = d => `${DOW[new Date(d.y, d.m - 1, d.d).getDay()]} ${d.d} ${MON[d.m - 1]} ${d.y}`;
const dayEnd = d => dms(shiftDay(d, 1));   // next local midnight (23 / 25 h after d0 on the dst days)
const hmE = ms => rmin(ms) >= dayEnd(state.date) ? '24:' + pad2(new Date(rmin(ms)).getMinutes()) : hm(ms);   // a log that runs to midnight ends at 24:00

// ---------- config: a customer is its code showing up in a window title ----------
const CFG = window.WORKTIME_CONFIG || {};
const PALETTE = ['#89b4fa', '#cba6f7', '#fab387', '#94e2d5', '#f5c2e7', '#f9e2af', '#74c7ec', '#f2cdcd', '#eba0ac', '#89dceb'];
const CAT = { blue: '#89b4fa', mauve: '#cba6f7', peach: '#fab387', teal: '#94e2d5', pink: '#f5c2e7', yellow: '#f9e2af', sapphire: '#74c7ec',
    flamingo: '#f2cdcd', maroon: '#eba0ac', sky: '#89dceb', green: '#a6e3a1', red: '#f38ba8', lavender: '#b4befe', rosewater: '#f5e0dc' };
const hashColor = code => { let h = 0; for (const ch of code) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };   // a code's colour never depends on the day
const CUST = new Map();   // code -> { code, name, color }: config.js, then customers.json (codes created from the page)
const addCust = c => { if (c && typeof c.code === 'string' && c.code && !CUST.has(c.code)) CUST.set(c.code, { code: c.code, name: c.name || c.code, color: CAT[c.color] || c.color || hashColor(c.code) }); };
// only known codes count: titles are full of other capitals (MDA, ERD, API, PDF); case-sensitive, so "Bettermann" is not BET
let CODE_RE = null;
const codeRe = () => { CODE_RE = CUST.size ? new RegExp(`\\b(${[...CUST.keys()].map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})\\b`) : null; };
(CFG.customers || []).forEach(addCust); codeRe();
let added = [];   // customers.json as loaded / saved
const codeOf = title => { const m = CODE_RE && CODE_RE.exec(title); return m ? m[1] : null; };   // the first code in the title
const color = code => CUST.has(code) ? CUST.get(code).color : 'var(--surface2)';
const CLS = [[/teams/, 'teams'], [/outlook/, 'outlook'], [/chatgpt/, 'chatgpt'], [/claude/, 'claude'], [/music\.youtube/, 'music'],
    [/keeper/, 'keeper'], [/office|excel|powerpoint|sharepoint/, 'office'], [/chrom/, 'chrome'], [/^code|vscode|visual/, 'code'],
    [/kitty/, 'kitty'], [/rider/, 'rider'], [/remmina/, 'remmina'], [/anydesk/, 'anydesk']];
function clsShort(c) {
    if (c === 'N/A') return 'locked';
    const l = c.toLowerCase();
    for (const [re, n] of CLS) if (re.test(l)) return n;
    return c.length > 10 ? c.slice(0, 10) : c;
}

// ---------- state ----------
const state = {
    date: todayD(), live: null, samples: [], items: [], sessions: [], runs: [], snaps: [], man: [],
    range: { start: 0, end: 1 }, day: null, sel: null, filter: null, px: null,
    laneW: 1, laneX: 0, chW: 8,
};
const scope = () => state.sel || state.day || state.range;

// ---------- parse ----------
const LINE = /^"(.*)","(.*)","(.*)","(.*)"$/, TS = /^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d):(\d\d)$/;
function parse(text, today) {
    const out = [], now = Date.now();
    for (const l of text.split(/\r?\n/)) {
        const m = LINE.exec(l), d = m && TS.exec(m[1]);
        if (!d) continue;   // header, blank or broken line
        const t = new Date(+d[1], d[2] - 1, +d[3], +d[4], +d[5], +d[6]).getTime();
        const locked = m[2] === 'N/A' && m[3] === 'N/A';
        out.push({ t, end: 0, title: m[2], cls: m[3], state: locked ? 'locked' : m[4] === 'true' ? 'idle' : 'active' });
    }
    out.sort((a, b) => a.t - b.t);
    // sample i covers [t, min(next, t+5min)); the last one 90 s, or up to now while the logger is alive today
    for (let i = 0; i < out.length; i++) {
        const s = out[i], n = out[i + 1];
        s.end = n ? Math.min(n.t, s.t + 5 * MIN) : today && now > s.t && now - s.t < 5 * MIN ? now : s.t + 90000;
    }
    return out;
}
const SUFFIX = / - Google Chrome$| - Visual Studio Code$| - Microsoft Azure$| \| Microsoft Teams$| - Outlook$| \(External\)$| \(External unfamiliar\)$/;
const GLYPH = /^[ -⯿\s]+/;   // spinner / status glyphs (✳ ◑ ◐ ●…) claude code puts in front of kitty titles
function clean(title) {   // display form: glyphs, unread counter "(2) " and app suffixes stripped, case kept
    let t = title.replace(GLYPH, '').replace(/^\(\d+\)\s+/, ''), u;
    while ((u = t.replace(SUFFIX, '')) !== t) t = u;
    return t.trim();
}
const titleKey = (title, cls) => clean(title).replace(/\s+/g, ' ').toLowerCase() + (cls === 'kitty' || cls === 'N/A' ? ' | ' + cls : '');

// samples -> sessions (+ off gaps in the same ordered list)
function build(samples) {
    const items = [], sessions = [];
    let cur = null;
    for (const s of samples) {
        const key = titleKey(s.title, s.cls);
        if (cur && cur.end === s.t && cur.key === key && cur.cls === s.cls && cur.state === s.state) { cur.end = s.end; continue; }
        if (cur && s.t > cur.end) items.push({ state: 'off', start: cur.end, end: s.t });
        cur = { start: s.t, end: s.end, key, title: s.title, cls: s.cls, state: s.state, code: null, run: -1 };
        items.push(cur); sessions.push(cur);
    }
    state.items = items; state.sessions = sessions;
}

// ---------- resolve: which customer, per session ----------
function cut() {   // split blocks at the edges of the ranges assigned by hand: a range never covers half a block
    const P = [...new Set(state.man.flatMap(r => [r.start, r.end]))].sort((a, b) => a - b);
    if (!P.length) return;
    const items = [];
    for (const it of state.items) {
        let cur = it;
        for (const p of P) if (p > cur.start && p < cur.end) { items.push({ ...cur, end: p }); cur = { ...cur, start: p }; }
        items.push(cur);
    }
    state.items = items; state.sessions = items.filter(i => i.state !== 'off');
}
const CARRY = HOUR;   // a customer's code counts for what follows until another code shows up, at most 1 h after it was last seen
function resolve() {
    const S = state.sessions, memo = new Map();
    let last = null;   // { code, end }: the last time a customer showed up, in a title or assigned by hand
    for (const s of S) {
        const m = s.state === 'active' ? at(state.man, s.start) : null;   // assigned by hand: beats the title
        s.code = null; s.man = !!m;
        if (s.state !== 'active') continue;
        if (m) { s.code = m.code === '?' ? null : m.code; last = s.code ? { code: s.code, end: s.end } : null; continue; }   // a hand-set ? ends the carry
        if (!memo.has(s.title)) memo.set(s.title, codeOf(s.title));
        const code = memo.get(s.title);
        if (code) { s.code = code; last = { code, end: s.end }; }
        else if (last && s.start - last.end <= CARRY) s.code = last.code;
    }
    // runs: the lane blocks, worked or inactive (idle + locked)
    const runs = [];
    let r = null;
    for (const it of state.items) {
        if (it.state === 'off') { r = null; continue; }
        const st = it.state === 'active' ? 'active' : 'idle';
        if (r && r.state === st) { r.end = it.end; it.run = r.i; }
        else { r = { i: runs.length, start: it.start, end: it.end, state: st }; runs.push(r); it.run = r.i; }
    }
    state.runs = runs;
}

// ---------- stats: the one source of every number ----------
function stats(sc, titles) {
    const r = { active: 0, idle: 0, byCode: {} };
    for (const it of state.items) {
        if (it.start >= sc.end) break;
        const a = Math.max(it.start, sc.start), b = Math.min(it.end, sc.end);
        if (b <= a) continue;
        const d = b - a;
        if (it.state === 'active') {
            r.active += d;
            const c = it.code || '?', e = r.byCode[c] || (r.byCode[c] = { active: 0, titles: titles ? new Map() : null });
            e.active += d;
            if (titles) { const t = clean(it.title); e.titles.set(t, (e.titles.get(t) || 0) + d); }
        } else if (it.state !== 'off') r.idle += d;
    }
    return r;
}
function codesOf(st) {   // customers by time, then ?; a few seconds cut off by an edge are no row
    const rank = c => c === '?' ? 1 : 0;
    return Object.keys(st.byCode).filter(c => st.byCode[c].active >= MIN / 2).sort((a, b) => rank(a) - rank(b) || st.byCode[b].active - st.byCode[a].active);
}

// ---------- timeline ----------
const lane = $('lane'), runsEl = $('runs'), ov = $('ov'), hoursEl = $('hours'), hl = $('hl'), readoutEl = $('ro');
const ms2x = ms => (ms - state.range.start) / (state.range.end - state.range.start) * state.laneW;
const x2ms = x => state.range.start + x / state.laneW * (state.range.end - state.range.start);
const pct = ms => (ms - state.range.start) / (state.range.end - state.range.start) * 100;
function measure() {
    state.chW = $('probe').getBoundingClientRect().width / 10;
    const r = lane.getBoundingClientRect();
    state.laneW = Math.max(1, r.width); state.laneX = r.left;
}
function layout() {   // the day = first to last active sample (a locked night is not the day); visible range: whole hours around it, ≥ 8 h
    const today = isToday(state.date), now = Date.now(), d0 = dms(state.date), d1 = dayEnd(state.date);
    const act = state.samples.filter(s => s.state === 'active'), S = act.length ? act : state.samples;
    let a, b;
    if (S.length) { a = floorH(S[0].t); b = ceilH(Math.max(S[S.length - 1].end, today ? now : 0)); }
    else if (today) { b = ceilH(now); a = b - 8 * HOUR; }
    else { a = d0 + 8 * HOUR; b = d0 + 18 * HOUR; }
    if (b - a < 8 * HOUR) b = a + 8 * HOUR;
    if (b > d1) { b = d1; a = Math.min(a, b - 8 * HOUR); }
    a = Math.max(a, d0);
    state.range = { start: a, end: b };
    state.day = S.length ? { start: S[0].t, end: S[S.length - 1].end } : null;
    // snap targets: block edges, now, range ends

    } catch (err) { msg('not saved: ' + (err.message || err)); }
    finally { saving--; }
}
asgIn.addEventListener('input', () => { asg.list = asgCands(asgIn.value); asg.idx = 0; renderAsg(); });
asgIn.addEventListener('keydown', e => {
    e.stopPropagation();   // typing never triggers the page keys
    const n = asg.list.length;
    if (e.key === 'Escape') { e.preventDefault(); closeAsg(); }
    else if (e.key === 'Enter') { e.preventDefault(); applyAsg(asg.list[asg.idx]); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Tab') {
        e.preventDefault();
        if (n) asg.idx = (asg.idx + (e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey) ? n - 1 : 1)) % n;
        renderAsg();
    }
});
asgList.addEventListener('pointerdown', e => { e.preventDefault(); const el = e.target.closest('[data-i]'); if (el) applyAsg(asg.list[+el.dataset.i]); });
document.addEventListener('pointerdown', e => { if (asg.range && !asgEl.contains(e.target) && !ov.contains(e.target)) closeAsg(); });
asgIn.addEventListener('blur', () => setTimeout(() => { if (asg.range && document.activeElement !== asgIn) closeAsg(); }, 0));

// ---------- copy: booking block for AbaNinja ----------
async function copyText(t) {
    try { await navigator.clipboard.writeText(t); }
    catch {
        const ta = document.createElement('textarea');
        ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch { }
        ta.remove();
    }
}
function copyBlock() {
    if (!state.day) return;
    const sc = scope(), st = stats(sc, true), rows = [];
    let tot = 0, totMs = 0;
    for (const c of codesOf(st)) {
        const e = st.byCode[c], act = e.active, d = qh(act);
        if (!d) continue;   // nothing to book: seconds cut off by an edge
        tot += d; totMs += act;
        const titles = [...e.titles].sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]).join(', ');
        rows.push([c, c === '?' ? '' : CUST.get(c).name, d.toFixed(2) + ' h', titles]);
    }
    const cw = Math.max(5, ...rows.map(r => r[0].length + 1)), nw = Math.max(5, ...rows.map(r => r[1].length)), T = tot.toFixed(2) + ' h';   // the total is the widest amount
    const lines = [`${dkey(state.date)}  ${state.sel ? 'selection' : 'day'} ${hm(sc.start)}–${hmE(sc.end)}`];
    for (const r of rows) lines.push(`${r[0].padEnd(cw)}${r[1].padEnd(nw)}  ${r[2].padStart(T.length)}   ${r[3]}`);
    lines.push(`${'total'.padEnd(cw + nw)}  ${T}   (${dur(totMs)} active before rounding)`);
    copyText(lines.join('\n'));
    const el = $('copy');
    if (el) { el.textContent = 'copied ✓'; el.classList.add('ok'); setTimeout(() => { if (el.isConnected) { el.textContent = 'copy  y'; el.classList.remove('ok'); } }, 1200); }
}

// ---------- keys / mouse ----------
document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    let used = true;
    switch (e.key) {
        case 'ArrowLeft': case '[': goDay(-1); break;
        case 'ArrowRight': case ']': goDay(1); break;
        case 't': goDay(0); break;
        case 'h': stepRun(-1, false); break;
        case 'l': stepRun(1, false); break;
        case 'H': stepRun(-1, true); break;
        case 'L': stepRun(1, true); break;
        case 'Escape': if (state.sel) { state.sel = null; finish(); } else if (state.filter) setFilter(null); break;
        case 'y': copyBlock(); break;
        default: used = false;
    }
    if (used) e.preventDefault();
});
custEl.addEventListener('click', e => {
    const el = e.target.closest('.tile');
    if (el) setFilter(state.filter === el.dataset.c ? null : el.dataset.c);
});
const tip = $('tip');
custEl.addEventListener('pointermove', e => {   // every tile tells all, even one too small for a label
    const el = e.target.closest('.tile'), t = el && tiles[+el.dataset.i];
    if (!t) { tip.hidden = true; return; }
    tip.textContent = `${t.c}${t.name ? '  ' + t.name : ''}   ${dur(t.active)}   ${t.d.toFixed(2)} h   ${Math.round(t.share * 100)}%`;
    tip.hidden = false;
    const w = tip.offsetWidth;
    tip.style.left = clamp(e.clientX + 12, 0, innerWidth - w - 4) + 'px'; tip.style.top = (e.clientY + 16) + 'px';
});
custEl.addEventListener('pointerleave', () => { tip.hidden = true; });
new ResizeObserver(() => renderSummary()).observe(custEl);
sumHead.addEventListener('click', e => { if (e.target.id === 'copy') copyBlock(); });
$('prev').addEventListener('click', () => goDay(-1));
$('next').addEventListener('click', () => goDay(1));
$('todayT').addEventListener('click', () => goDay(0));

// ---------- boot ----------
function readHash() {   // #YYYY-MM-DD or #YYYY-MM-DD/HH:MM-HH:MM
    const m = /^#(\d{4})-(\d\d)-(\d\d)(?:\/(\d\d):(\d\d)-(\d\d):(\d\d))?$/.exec(location.hash);
    if (!m) return null;
    const date = shiftDay({ y: +m[1], m: +m[2], d: +m[3] }, 0);
    if (dkey(date) !== `${m[1]}-${m[2]}-${m[3]}`) return null;   // impossible date
    const at = (h, mi) => new Date(date.y, date.m - 1, date.d, +h, +mi).getTime();
    return { date, sel: m[4] ? { start: at(m[4], m[5]), end: at(m[6], m[7]) } : null };
}
function setHash() {
    const h = '#' + dkey(state.date) + (state.sel ? `/${hm(state.sel.start)}-${hmE(state.sel.end)}` : '');
    if (location.hash !== h) try { history.replaceState(null, '', h); } catch { }
}
function goDay(n) {
    state.date = n ? shiftDay(state.date, n) : todayD();
    state.sel = loadSel(); state.filter = null;
    setHash();
    load(false);
}
function prepare() { build(state.samples); cut(); resolve(); layout(); }
function refresh() {   // the assigned ranges changed: same day, same selection
    prepare();
    renderLane(); renderSel(-1); renderSummary(); hover(state.px);
}
async function load(keep) {
    const key = dkey(state.date);
    let text = '';
    const [, man, cust] = await Promise.all([
        fetch(`logs/activity_log_${key}.csv`, { cache: 'no-store' }).then(async r => { if (r.ok) text = await r.text(); }).catch(() => { }),
        getJson(`logs/assign_${key}.json`), getJson('customers.json')]);
    if (key !== dkey(state.date) || (keep && (drag || asg.range || saving))) return;   // navigated meanwhile / busy
    if (Array.isArray(cust)) { added = cust.filter(c => c && typeof c.code === 'string'); added.forEach(addCust); }
    state.man = parseMan(man, state.date); codeRe();
    state.live = isToday(state.date) ? key : null;
    state.samples = parse(text, isToday(state.date));
    prepare();
    if (!state.day) state.sel = null;
    else if (state.sel) { state.sel = { start: clamp(state.sel.start, state.range.start, state.range.end), end: clamp(state.sel.end, state.range.start, state.range.end) }; if (state.sel.end - state.sel.start < MIN) state.sel = null; }
    store.set('sel.' + dkey(state.date), state.sel); setHash();
    renderHeader(); renderHours(); renderLane(); renderSel(-1); renderSummary();
    hover(state.px);
}
measure();
new ResizeObserver(() => { measure(); renderHours(); renderSel(-1); }).observe(lane);
function selFrom(h) {   // the hash has whole minutes: keep the exact stored selection when it reads the same
    const s = loadSel();
    return h && h.sel && !(s && hm(s.start) === hm(h.sel.start) && hmE(s.end) === hmE(h.sel.end)) ? h.sel : s;
}
{
    const h = readHash();
    if (h) state.date = h.date;
    state.sel = selFrom(h);
    setHash();
    load(false);
}
window.addEventListener('hashchange', () => {
    const h = readHash();
    if (!h) { setHash(); return; }
    state.date = h.date; state.sel = selFrom(h); state.filter = null; load(false);
});
function tick() {   // today refetches; a live page left open follows the clock past midnight
    if (isToday(state.date)) load(true);
    else if (state.live === dkey(state.date) && !drag && !asg.range) goDay(0);
}
setInterval(tick, 60000);
window.addEventListener('focus', tick);
</script>
